<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>한일 목록 To-Do List</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #e8f7ef 0%, #d6f0df 100%);
            display: flex;
            justify-content: center;
            padding: 24px 14px;
            color: #222;
        }

        .app {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid rgba(99, 166, 121, 0.16);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 14px 34px rgba(46, 125, 82, 0.14);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 6px;
        }

        .subtitle {
            color: #777;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .input-area {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 14px;
            border: 1px solid #cfe8d8;
            border-radius: 20px;
            font-size: 15px;
            outline: none;
            background: #fbfffc;
        }

        input:focus {
            border-color: #43a66f;
            box-shadow: 0 0 0 4px rgba(67, 166, 111, 0.14);
        }

        button {
            border: none;
            cursor: pointer;
            border-radius: 20px;
            font-size: 14px;
            transition: 0.2s;
        }

        .add-btn {
            background: #43a66f;
            color: #fff;
            padding: 0 18px;
            font-weight: 600;
        }

        .add-btn:hover {
            background: #368b5c;
        }

        ul {
            list-style: none;
        }

        li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 14px;
            background: #f6fbf8;
            border-radius: 20px;
            margin-bottom: 10px;
        }

        .task-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }

        .check {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid #43a66f;
            background: #fff;
            flex-shrink: 0;
        }

        .completed .check {
            background: #43a66f;
            border-color: #43a66f;
        }

        .completed .check::after {
            content: "✓";
            color: white;
            font-size: 14px;
            font-weight: bold;
            position: absolute;
            left: 5px;
            top: 0px;
        }

        .task-text {
            font-size: 15px;
            word-break: break-word;
        }

        .completed {
            opacity: 0.6;
        }

        .completed .task-text {
            color: #9aa0a6;
            text-decoration: line-through;
            text-decoration-thickness: 2px;
        }

        .delete-btn {
            background: #eef8f2;
            color: #2f8a58;
            padding: 8px 10px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .delete-btn:hover {
            background: #dff2e7;
        }

        .empty {
            text-align: center;
            color: #999;
            font-size: 14px;
            padding: 24px 0;
        }

        .summary {
            margin-top: 14px;
            font-size: 13px;
            color: #47745a;
            text-align: right;
        }

        .remaining-count {
            margin-bottom: 14px;
            padding: 12px 14px;
            background: #eef3ff;
            color: #315bdc;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
            text-align: center;
        }

        
        .actions{
            display:flex;
            justify-content:flex-end;
            margin-bottom:16px;
        }
        .clear-btn{
            background:#ff9800;
            color:#fff;
            padding:10px 14px;
            font-weight:600;
        }
        .clear-btn:hover{background:#f57c00;}


        @media (max-width: 480px) {
            .app {
                padding: 20px;
                border-radius: 18px;
            }

            h1 {
                font-size: 22px;
            }

            input {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>
    <div class="app">
        <h1>한일 목록</h1>
        <p class="subtitle">오늘 해야 할 일을 간단히 관리하세요.</p>

        <div class="input-area">
            <input type="text" id="taskInput" placeholder="새 작업 입력" />
            <button class="add-btn" onclick="addTask()">추가</button>
        </div>

        <div class="actions">
            <button class="clear-btn" onclick="clearCompleted()">완료된 작업 삭제</button>
        </div>

        <div id="remainingCount" class="remaining-count">남은 작업 0개</div>
        <ul id="taskList"></ul>
        <div id="emptyMessage" class="empty">등록된 작업이 없습니다.</div>
        <div id="summary" class="summary"></div>
    </div>

    <script>
        let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

        const taskInput = document.getElementById("taskInput");
        const taskList = document.getElementById("taskList");
        const emptyMessage = document.getElementById("emptyMessage");
        const summary = document.getElementById("summary");
        const remainingCount = document.getElementById("remainingCount");

        taskInput.addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                addTask();
            }
        });

        function saveTasks() {
            localStorage.setItem("tasks", JSON.stringify(tasks));
        }

        function addTask() {
            const text = taskInput.value.trim();

            if (!text) {
                alert("작업 내용을 입력하세요.");
                return;
            }

            tasks.push({
                id: Date.now(),
                text: text,
                completed: false
            });

            taskInput.value = "";
            saveTasks();
            renderTasks();
        }

        function toggleTask(id) {
            tasks = tasks.map(task =>
                task.id === id ? { ...task, completed: !task.completed } : task
            );

            saveTasks();
            renderTasks();
        }

        function deleteTask(id) {
            tasks = tasks.filter(task => task.id !== id);
            saveTasks();
            renderTasks();
        }

        
        function clearCompleted() {
            const completedCount = tasks.filter(task => task.completed).length;
            if (completedCount === 0) {
                alert("삭제할 완료된 작업이 없습니다.");
                return;
            }
            if (!confirm(`완료된 작업 ${completedCount}개를 삭제하시겠습니까?`)) {
                return;
            }
            tasks = tasks.filter(task => !task.completed);
            saveTasks();
            renderTasks();
        }

        function renderTasks() {
            taskList.innerHTML = "";

            tasks.forEach(task => {
                const li = document.createElement("li");
                li.className = task.completed ? "completed" : "";

                li.innerHTML = `
                <div class="task-left" onclick="toggleTask(${task.id})" style="cursor:pointer;">
                    <button class="check"></button>
                    <span class="task-text">${escapeHtml(task.text)}</span>
                </div>
                <button class="delete-btn" onclick="deleteTask(${task.id})">삭제</button>
        `;

                taskList.appendChild(li);
            });

            emptyMessage.style.display = tasks.length === 0 ? "block" : "none";

            const completedCount = tasks.filter(task => task.completed).length;
            const remainingTaskCount = tasks.length - completedCount;

            remainingCount.textContent = `남은 작업 ${remainingTaskCount}개`;
            remainingCount.style.display = tasks.length === 0 ? "none" : "block";

            summary.textContent = tasks.length
                ? `전체 ${tasks.length}개 / 완료 ${completedCount}개 / 남은 작업 ${remainingTaskCount}개`
                : "";
        }

        function escapeHtml(text) {
            return text
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        renderTasks();
    </script>
</body>

</html>
